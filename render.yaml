services:
  - type: web
    name: scaler-typeform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    # User-selected demo hosting. This filesystem is ephemeral, not durable storage.
    plan: free
    numInstances: 1
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: TYPEFORM_ENVIRONMENT
        value: production
      - key: TYPEFORM_DATABASE_PATH
        value: /app/data/typeform.sqlite3
      - key: TYPEFORM_ALLOWED_ORIGINS
        sync: false
      - key: TYPEFORM_FOUNDATION_PROBE_ENABLED
        value: "true"
      - key: TYPEFORM_SESSION_DAYS
        value: "30"
